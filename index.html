<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід — Облік ДЛ та ЛРА</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(15, 23, 42, 0.6);
            --input-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        body { 
            background: var(--bg-gradient); 
            color: var(--text-main);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card-auth { 
            width: 100%; 
            max-width: 480px; 
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            border: 1px solid var(--card-border); 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            padding: 36px 32px !important;
        }
        .logo-block { text-align: center; margin-bottom: 24px; }
        .logo-icon {
            width: 58px; height: 58px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 14px;
            display: inline-flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
            font-size: 26px;
            user-select: none;
        }
        .logo-block h1 { font-size: 1.35rem; font-weight: 700; color: var(--text-main); margin-bottom: 4px; }
        .logo-block p { font-size: 0.85rem; color: var(--text-muted); margin: 0; }
        .form-label { color: var(--text-muted); font-size: 0.82rem; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
        .form-select, .form-control {
            background-color: var(--input-bg) !important;
            border: 1px solid var(--input-border) !important;
            color: var(--text-main) !important;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.95rem;
        }
        .form-select:focus, .form-control:focus {
            border-color: var(--accent) !important;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15) !important;
            outline: none;
        }
        .form-select:disabled { opacity: 0.55; cursor: not-allowed; }
        .btn-primary {
            background: var(--accent);
            border: none;
            border-radius: 10px;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            color: #0f172a;
            margin-top: 8px;
        }
        .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
        .alert-danger {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #fca5a5;
            border-radius: 10px;
            padding: 12px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="card card-auth">
    <div class="logo-block">
        <div class="logo-icon">📋</div>
        <h1>Облік ДЛ та ЛРА</h1>
        <p id="statusText">Авторизація відповідального / перевіряючого</p>
    </div>

    <form id="waybillAuthForm">
        <!-- 1. Напрямок обліку (визначає режим) -->
        <div class="mb-3">
            <label for="operatorTypeSelect" class="form-label">Напрямок / Служба</label>
            <select class="form-select" id="operatorTypeSelect" required onchange="handleRoleChange(this.value)">
                <option value="ДЛ" selected>🚗 Дорожні листи (ОВТ / колісна техніка)</option>
                <option value="ЛРА">📋 Листи роботи агрегатів (ІТ / генератори)</option>
                <option value="СВТОЛ">🛠️ СВТОЛ (Перевірка Дорожніх листів ОВТ)</option>
                <option value="ЕТС">⚡ ЕТС (Перевірка Листів роботи агрегатів ІТ)</option>
            </select>
        </div>

        <!-- 2. Батальйон (авто-ALL для СВТОЛ/ЕТС) -->
        <div class="mb-3">
            <label for="batSelect" class="form-label">Батальйон</label>
            <select class="form-select" id="batSelect" required disabled>
                <option value="" selected disabled>Завантаження структури...</option>
            </select>
        </div>

        <!-- 3. Звітний період -->
        <div class="row g-3 mb-3">
            <div class="col-7">
                <label for="monthSelect" class="form-label">Звітний місяць</label>
                <select class="form-select" id="monthSelect" required disabled>
                    <option value="" selected disabled>Завантаження...</option>
                </select>
            </div>
            <div class="col-5">
                <label for="yearSelect" class="form-label">Рік</label>
                <select class="form-select" id="yearSelect" required disabled>
                    <option value="" selected disabled>...</option>
                </select>
            </div>
        </div>

        <!-- 4. Пароль -->
        <div class="mb-4">
            <label for="operatorPassword" class="form-label">Пароль доступу</label>
            <input type="password" class="form-control" id="operatorPassword" required placeholder="Введіть пароль...">
        </div>

        <div id="errorDiv" class="alert alert-danger d-none mb-4" role="alert"></div>

        <button type="submit" id="submitBtn" class="btn btn-primary w-100" disabled>
            <span id="btnSpinner" class="spinner-border spinner-border-sm d-none me-2" role="status" aria-hidden="true"></span>
            <span id="btnText">Увійти до терміналу обліку</span>
        </button>
    </form>
</div>

<script>
    const N8N_URL_INIT_AUTH  = 'https://n8n.pmm-system.com/webhook/v4/get-waybill-auth-init';
    const N8N_URL_CHECK_AUTH = 'https://n8n.pmm-system.com/webhook/v4/check-waybill-auth';
    const N8N_URL_LOG_ENTER  = 'https://n8n.pmm-system.com/webhook/v4/log-waybill-enter';

    const batSelect          = document.getElementById('batSelect');
    const operatorTypeSelect = document.getElementById('operatorTypeSelect');
    const monthSelect        = document.getElementById('monthSelect');
    const yearSelect         = document.getElementById('yearSelect');
    const operatorPassword   = document.getElementById('operatorPassword');
    const errorDiv           = document.getElementById('errorDiv');
    const submitBtn          = document.getElementById('submitBtn');
    const btnText            = document.getElementById('btnText');
    const btnSpinner         = document.getElementById('btnSpinner');

    let availableBats = [];
    let allMonthKeys  = [];

    function handleRoleChange(role) {
        if (role === 'СВТОЛ' || role === 'ЕТС') {
            batSelect.innerHTML = '<option value="ALL" selected>Всі батальйони (Служба бригади)</option>';
            batSelect.disabled = true;
        } else {
            batSelect.disabled = false;
            renderBattalionOptions();
        }
    }

    function renderBattalionOptions() {
        batSelect.innerHTML = '<option value="" selected disabled>-- Оберіть батальйон --</option>';
        availableBats.forEach(b => {
            if (b !== 'ALL') {
                const opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                batSelect.appendChild(opt);
            }
        });
    }

    function getDeviceAndBrowser() {
        const ua = navigator.userAgent;
        let device = "PC", browser = "Browser";
        if (/iphone|ipad|ipod/i.test(ua)) device = "iOS";
        else if (/android/i.test(ua)) device = "Android";
        else if (/windows/i.test(ua)) device = "Windows";
        else if (/macintosh/i.test(ua)) device = "Mac";
        else if (/linux/i.test(ua)) device = "Linux";

        if (/chrome|crios/i.test(ua)) browser = "Chrome";
        else if (/firefox|fxios/i.test(ua)) browser = "Firefox";
        else if (/safari/i.test(ua)) browser = "Safari";
        else if (/edg/i.test(ua)) browser = "Edge";
        return { device, browser };
    }

    fetch(N8N_URL_INIT_AUTH)
        .then(res => {
            if (!res.ok) throw new Error(`HTTP помилка: ${res.status}`);
            return res.json();
        })
        .then(data => {
            let res = Array.isArray(data) ? data[0] : data;
            if (res.json) res = res.json;

            availableBats = res.bats || ['1ЛБ', '2ЛБ', '3ЛБ', '4ЛБ', '5ЛБ', '1БПС', '2БПС', 'Упр'];
            allMonthKeys = res.month_keys || [];

            renderBattalionOptions();
            batSelect.disabled = false;

            if (allMonthKeys.length > 0) {
                initYearAndMonthSelect(allMonthKeys);
            }
            submitBtn.disabled = false;
        })
        .catch(err => {
            console.error(err);
            showError("🔴 Помилка зв'язку з базою: не вдалося завантажити довідники.");
        });

    function initYearAndMonthSelect(periods) {
        const uniqueYears = [...new Set(periods.map(m => m.month_key.split('_')[1]).filter(Boolean))].sort().reverse();

        yearSelect.innerHTML = '';
        uniqueYears.forEach(y => {
            const opt = document.createElement('option');
            opt.value = y;
            opt.textContent = y;
            yearSelect.appendChild(opt);
        });

        const todayStr = new Date().toISOString().split('T')[0];
        const activePeriod = periods.find(p => p.start_date && p.end_date && todayStr >= p.start_date && todayStr <= p.end_date);

        let defaultYear = uniqueYears[0];
        let defaultMonthNum = '';

        if (activePeriod) {
            const parts = activePeriod.month_key.split('_');
            defaultMonthNum = parts[0];
            defaultYear = parts[1];
        } else if (periods.length > 0) {
            const parts = periods[0].month_key.split('_');
            defaultMonthNum = parts[0];
            defaultYear = parts[1];
        }

        yearSelect.value = defaultYear;
        yearSelect.disabled = false;

        updateMonthsForYear(defaultYear, defaultMonthNum);

        yearSelect.addEventListener('change', function() {
            updateMonthsForYear(this.value, null);
        });
    }

    function updateMonthsForYear(selectedYear, targetMonthNum) {
        monthSelect.innerHTML = '';
        const monthsForYear = allMonthKeys
            .filter(m => m.month_key.split('_')[1] === selectedYear)
            .sort((a, b) => parseInt(a.month_key.split('_')[0]) - parseInt(b.month_key.split('_')[0]));

        monthsForYear.forEach(m => {
            const num = m.month_key.split('_')[0];
            const opt = document.createElement('option');
            opt.value = num;
            const capitalizedName = m.month_name ? m.month_name.charAt(0).toUpperCase() + m.month_name.slice(1) : '';
            opt.textContent = `${capitalizedName} (${num})`;

            if (targetMonthNum && num === targetMonthNum) {
                opt.selected = true;
            }
            monthSelect.appendChild(opt);
        });

        monthSelect.disabled = false;
    }

    function showError(message) {
        errorDiv.innerText = message;
        errorDiv.classList.remove('d-none');
        submitBtn.disabled = false;
        btnText.innerText = 'Увійти до терміналу обліку';
        btnSpinner.classList.add('d-none');
    }

    document.getElementById('waybillAuthForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const operatorType = operatorTypeSelect.value;
        const bat          = (operatorType === 'СВТОЛ' || operatorType === 'ЕТС') ? 'ALL' : batSelect.value;
        const month        = monthSelect.value;
        const year         = yearSelect.value;
        const monthKey     = `${month}_${year}`;
        const pass         = operatorPassword.value.trim();

        if (!bat) {
            showError('Оберіть батальйон!');
            return;
        }

        errorDiv.classList.add('d-none');
        submitBtn.disabled = true;
        btnText.innerText = 'Перевірка...';
        btnSpinner.classList.remove('d-none');

        const info = getDeviceAndBrowser();

        try {
            const resAuth = await fetch(N8N_URL_CHECK_AUTH, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    bat: bat,
                    operator_type: operatorType,
                    month_key: monthKey,
                    password: pass
                })
            });

            let data = await resAuth.json();
            let res = Array.isArray(data) ? data[0] : data;
            if (res.json) res = res.json;

            if (res && res.success === true) {
                btnText.innerText = 'Успішно! Перехід...';

                sessionStorage.setItem('pmm_waybill_session', JSON.stringify({
                    bat: bat,
                    operator_type: operatorType,
                    month_key: monthKey,
                    pib: res.pib || '',
                    military_rank: res.military_rank || ''
                }));

                try {
                    await fetch(N8N_URL_LOG_ENTER, {
                        method: 'POST',
                        keepalive: true,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            category: bat,
                            sub_unit: operatorType,
                            month_key: monthKey,
                            status: `Користувач ${operatorType} (${bat}): Успішно`,
                            device: info.device,
                            browser: info.browser
                        })
                    });
                } catch (logErr) {}

                window.location.href = `index_PMM_waybill.html?bat=${encodeURIComponent(bat)}&type=${encodeURIComponent(operatorType)}&month_key=${encodeURIComponent(monthKey)}`;
            } else {
                try {
                    await fetch(N8N_URL_LOG_ENTER, {
                        method: 'POST',
                        keepalive: true,
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            category: bat,
                            sub_unit: operatorType,
                            month_key: monthKey,
                            status: `Користувач ${operatorType} (${bat}): Невірний пароль`,
                            device: info.device,
                            browser: info.browser
                        })
                    });
                } catch (logErr) {}

                showError(res && res.message ? res.message : '❌ Невірний пароль доступу!');
            }
        } catch (err) {
            console.error(err);
            showError("❌ Помилка з'єднання із сервером перевірки.");
        }
    });
</script>
</body>
</html>
